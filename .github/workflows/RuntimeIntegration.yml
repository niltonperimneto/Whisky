name: Runtime Integration

# Checks a published winecx-gptk runtime against what this app relies on.
# winecx-gptk sends runtime-published after every canary; the weekly run
# re-checks the catalog's newest entry against Whisky's current main.
on:
  repository_dispatch:
    types: [runtime-published]
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: runtime-integration
  cancel-in-progress: false

env:
  HUB: niltonperimneto/winecx-gptk

jobs:
  contract:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      ARCHIVE_URL: ${{ github.event.client_payload.archiveURL }}
      ARCHIVE_SHA256: ${{ github.event.client_payload.sha256 }}
      RUNTIME_VERSION: ${{ github.event.client_payload.version }}
      RUNTIME_LAYOUT_VERSION: ${{ github.event.client_payload.runtimeLayoutVersion }}
      HUB_COMMIT: ${{ github.event.client_payload.hubCommit || 'main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the catalog and the layout contract
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime"
          curl -fsSL -o "$RUNNER_TEMP/runtime/catalog.json" \
            "https://raw.githubusercontent.com/$HUB/main/runtime-catalog-v2.json"
          if [ -z "$ARCHIVE_URL" ]; then
            # Scheduled or manual: the catalog's newest entry.
            ARCHIVE_URL=$(jq -r '.runtimes[0].archiveURL' "$RUNNER_TEMP/runtime/catalog.json")
            ARCHIVE_SHA256=$(jq -r '.runtimes[0].sha256' "$RUNNER_TEMP/runtime/catalog.json")
            RUNTIME_VERSION=$(jq -r '.runtimes[0].version' "$RUNNER_TEMP/runtime/catalog.json")
            RUNTIME_LAYOUT_VERSION=$(jq -r '.runtimes[0].runtimeLayoutVersion // 1' "$RUNNER_TEMP/runtime/catalog.json")
          fi
          if [ "${RUNTIME_LAYOUT_VERSION:-1}" = 2 ]; then
            contract="$HUB_COMMIT/contracts/runtime-layout.json"
          else
            contract="main/contracts/runtime-layout-v1.json"
          fi
          curl -fsSL -o "$RUNNER_TEMP/runtime/contract.json" "https://raw.githubusercontent.com/$HUB/$contract"
          {
            echo "ARCHIVE_URL=$ARCHIVE_URL"
            echo "ARCHIVE_SHA256=$ARCHIVE_SHA256"
            echo "RUNTIME_VERSION=$RUNTIME_VERSION"
          } >> "$GITHUB_ENV"
      - name: Download, verify and unpack the runtime
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/runtime/Libraries.tar.gz" "$ARCHIVE_URL"
          echo "$ARCHIVE_SHA256  $RUNNER_TEMP/runtime/Libraries.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/runtime/Libraries.tar.gz" -C "$RUNNER_TEMP/runtime"
      - name: Run the runtime contract tests
        env:
          WHISKY_RUNTIME_LIBRARIES: ${{ runner.temp }}/runtime/Libraries
          WHISKY_RUNTIME_CONTRACT: ${{ runner.temp }}/runtime/contract.json
          WHISKY_RUNTIME_CATALOG: ${{ runner.temp }}/runtime/catalog.json
        run: swift test --package-path WhiskyKit --filter RuntimeContractTests
      - name: Report a broken contract
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          HUB_TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
        run: |
          title="Runtime $RUNTIME_VERSION breaks the Whisky runtime contract"
          body="RuntimeIntegration failed for $ARCHIVE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create -R "${{ github.repository }}" --title "$title" --body "$body"
          if [ -n "$HUB_TOKEN" ]; then
            GH_TOKEN="$HUB_TOKEN" gh issue create -R "$HUB" --title "$title" --body "$body"
          fi
